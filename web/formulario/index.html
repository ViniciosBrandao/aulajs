<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <!--action que vai tratar os dados, post troca mensagens no corpo sem passar pela URL-->
    <form action="codigo.js" method="post">

        <label for="nome">
            Nome Completo
        </label>
        <input type="text" 
        id="nome" 
        name="nome"
        placeholder="Digite seu nome"
        minlength="4"
        maxlength="20"
        required
        >
        <br><br>

        <label for="endereco">
            Endereço
        </label>
        <input type="text" 
        id="endereco" 
        name="endereco"
        placeholder="Digite seu endereço"
        minlength="4"
        maxlength="50"
        required
        >

        <label for="cep">
            CEP
        </label>
        <input type="text"
        id="cep"
        name="cep"
        placeholder="Digite seu CEP"
        pattern="[0-9]{5}-[0-9]{3}"
        maxlength="9"
        required
        >
        <br><br>

        <label for="email">
            E-Mail
        </label>
        <input type="email" 
        id="email" 
        name="email"
        placeholder="Digite seu e-mail"
        minlength="4"
        maxlength="20"
        required
        >
        <br><br>

        <label for="senha">
            Senha
        </label>
        <input type="password" 
        id="senha" 
        name="senha"
        placeholder="Digite seu senha"
        minlength="4"
        maxlength="20"
        required
        >
        <br><br>
        
        <label for="tel">
            Telefone
        </label>
        <input type="tel"
        id="tel"
        name="tel"
        placeholder="Digite seu telefone"
        >
        <br><br>

        <label for="dataNascimento">
            Data Nascimento
        </label>
        <input type="date"
        id="dataNascimento"
        name="dataNascimento"
        placeholder="01/01/1900"
        >
        <br><br>

        <label for="site">
            Site
        </label>
        <input type="url"
        id="site"
        name="site"
        placeholder="Digite sua URL"
        >
        <br>
        <!--repare que colocamos o label depois pois o input vem primeiro em radio, primeiro seleciona, depois nomeia-->
        <p>Sexo</p>
        <input type="radio"
        id="masculino"
        name="sexo"
        value="M"
        >
        <label for="masculino">
            Masculino
        </label>
        <!--como o name esta o mesmo, 'sexo' para os dois ficam excludentes, seleciona um ou outro-->
        <input type="radio"
        id="feminino"
        name="sexo" 
        value="F"
        >
        <label for="feminino">
            Feminino
        </label>

        <p>Assuntos de Interesse</p>
        <input type="checkbox"
        id="tecnologia"
        name="tecnologia"
        value="tecnologia"
        >
        <label for="tecnologia">
            Tecnologia
        </label>

        <input type="checkbox"
        id="Ciências"
        name="Ciências"
        value="Ciências"
        >
        <label for="Ciências">
            Ciências
        </label>

         <input type="checkbox"
        id="Entretenimento"
        name="Entretenimento"
        value="Entretenimento"
        >
        <label for="Entretenimento">
            Entretenimento
        </label>
        <br><br>

        <label for="estadoCivil">
            Estado Civil
        </label>
        <select name="estadoCivil" id="estadoCivil" required>
            <option value="solteiro">Solteiro</option>
            <option value="casado">Casado</option>
            <option value="divorciado">Divorciado</option>
            <option value="viuvo">Viúvo</option>
        </select>
        <br><br>

        <label for="uf">
            UF
        </label>
        <select name="uf" id="uf" required>
            <option value="" selected disabled></option>
            <option value="go">Goiás</option>
            <option value="mt">Mato Grosso</option>
            <option value="ms">Mato Grosso do Sul</option>
        </select>

        <input type="submit" value="Enviar">
        <input type="reset" value="Redefinir">

    </form>
</body>
</html>
