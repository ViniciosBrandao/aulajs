<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palíndromo</title>
</head>
<body>
    <header>
        <h1>PROVA</h1>
    </header>

    <main>
            <fieldset>
                <legend>Qual tamanho do Vetor?</legend>
                <p>
                    <label for="idInTamanhoVetor">Tamanho do Vetor:</label>
                    <input type="number" id="idInTamanhoVetor" placeholder="Um número de 0 a 100" autocomplete="off" required>
                    <button type="button" id="btnCriarConjunto">Criar Conjunto</button>

                </p>

                <h3>Conjunto criado</h3>
                <p id="outConjunto"></p>

                <p>
                    <button type="button" id="btnInverter">Inverter</button>
                    <button type="button" id="btnLimpar">Limpar</button>
                </p>
            </fieldset>
        

        <section id="idOutAreaResultado" aria-live="polite">
            <pre id="idOutInverterVetor"></pre>
        </section>
    </main>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
