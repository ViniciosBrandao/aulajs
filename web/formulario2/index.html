<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula02Form</title>
</head>
<body>
    <form action="index.html" method="post">
        <fieldset>
        <legend><b>Dados Pessoais</b></legend>
        <br>

        <label for="nome">Nome</label>
        <input type="text" 
        id="nome"
        placeholder="Digite seu nome completo"
        name="nome"
        required
        >
        <br><br>

        <label for="cpf">CPF</label>
        <input type="text" 
        id="cpf"
        placeholder="Digite seu CPF"
        name="nome"
        required
        >
        <br><br>

        <label for="dataNascimento">
            Data Nascimento
        </label>
        <input type="date"
        id="dataNascimento"
        name="dataNascimento"
        placeholder="01/01/1900"
        >
        <br><br>
        </fieldset>

        <fieldset>
        <legend><b>Localização</b></legend>
        <label for="uf">
            UF
        </label>
        <select name="uf" id="uf" required>
            <option value="" selected disabled></option>
            <option value="go">Goiás</option>
            <option value="mt">Mato Grosso</option>
            <option value="ms">Mato Grosso do Sul</option>
        </select>

        <label for="endereco">
            Endereço
        </label>
        <input type="text" 
        id="endereco" 
        name="endereco"
        placeholder="Digite seu endereço"
        minlength="4"
        maxlength="50"
        required
        >

        
        <br><br>

        <label for="cep">
            CEP
        </label>
        <input type="text"
        id="cep"
        name="cep"
        placeholder="Digite seu CEP"
        pattern="[0-9]{5}-[0-9]{3}"
        maxlength="9"
        required
        >
        <br><br>
        </fieldset>

        <fieldset>
            <legend><b>E-Mail</b></legend>
        <label for="email">
            E-Mail
        </label>
        <input type="email" 
        id="email" 
        name="email"
        placeholder="Digite seu e-mail"
        minlength="4"
        maxlength="20"
        required
        >
        <br><br>

        <label for="site">
            Site
        </label>
        <input type="url"
        id="site"
        name="site"
        placeholder="Digite sua URL"
        >
        <br>
        </fieldset>

        <fieldset>
            <legend><b>Identidade</b></legend>
            <p>Sexo</p>
        <input type="radio"
        id="masculino"
        name="sexo"
        value="M"
        >
        <label for="masculino">
            Masculino
        </label>
        <!--como o name esta o mesmo, 'sexo' para os dois ficam excludentes, seleciona um ou outro-->
        <input type="radio"
        id="feminino"
        name="sexo" 
        value="F"
        >
        <label for="feminino">
            Feminino
        </label>
        <br><br>

        <label for="estadoCivil">
            Estado Civil
        </label>
        <select name="estadoCivil" id="estadoCivil" required>
            <option value="solteiro">Solteiro</option>
            <option value="casado">Casado</option>
            <option value="divorciado">Divorciado</option>
            <option value="viuvo">Viúvo</option>
        </select>
        <br><br>
        </fieldset>

        <fieldset>
            <legend><b>Interesses</b></legend>
        <input type="checkbox"
        id="tecnologia"
        name="tecnologia"
        value="tecnologia"
        >
        <label for="tecnologia">
            Tecnologia
        </label>

        <input type="checkbox"
        id="Ciências"
        name="Ciências"
        value="Ciências"
        >
        <label for="Ciências">
            Ciências
        </label>

         <input type="checkbox"
        id="Entretenimento"
        name="Entretenimento"
        value="Entretenimento"
        >
        <label for="Entretenimento">
            Entretenimento
        </label>
        <br><br>
        </fieldset>

        <fieldset>
            <legend><b>Observações</b></legend>
        <label for="observacao"></label>
        <textarea name="observacao" 
        id="observacao"
        rows="5"
        cols="40">
        </textarea>
        </textarea>
        </fieldset>

        <input type="submit" value="Enviar">
        <input type="reset" value="Redefinir">
    </form>
</body>
</html>
