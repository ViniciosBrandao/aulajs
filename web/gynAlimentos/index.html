<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE PAGAMENTO GYNALIMENTOS</title>
</head>
<body>
    <form id="idFormularioFuncionario">
    <fieldset>
      <legend>Cadastro do Funcionário</legend>

      <p>
        <label for="idInMatricula">Matrícula:</label><br>
        <input type="number" id="idInMatricula" step="1" min="1" required>
      </p>

      <p>
        <label for="campoNome">Nome Completo:</label><br>
        <input type="text" id="idInCampoNome" required>
      </p>

      <p>
        <label for="idInNumeroDependentes">Número de depedentes:</label><br>
        <input type="number" id="idInNumeroDependentes" step="1" min="0">
      </p>

      <p>
        <label for="idInSalarioBase">Salário Base:</label><br>
        <input type="number" id="idInSalarioBase" step="0.01" min="1632" required>
      </p>

      <p>
        <label for="idInProducao">Produção:</label><br>
        <input type="number" id="idInProducao" step="1" min="0">
      </p>
      

      <p>
        <button type="submit">Calcular e Exibir</button>
        <button type="reset">Limpar</button>
      </p>
    </fieldset>
  </form>

  <section id="idOutAreaResultado" aria-live="polite"></section>

  <!--  Importação do arquivo de integração em formato de módulo ES6 -->
  <!--  type = "module" serve para indicar que o app.js vai importar itens-->
  <!--
        type="module": é o atributo fundamental aqui. 
        Ele avisa ao navegador que o arquivo faz uso do sistema nativo 
        de módulos do JavaScript (ESM). Isso habilita comportamentos essenciais:
        Permite o uso de import e export: sem type="module", 
        comandos como import { Paciente } from './Paciente.js'; 
        gerariam um erro no console (SyntaxError: Cannot use import statement 
        outside a module).
  --> 
  <script type="module" src="./js/app.js"></script>
</body>
</html>
