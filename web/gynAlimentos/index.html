<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contracheque - GYNAlimentos</title>

  <!-- Folha de estilo externa: o visual fica no CSS, a estrutura no HTML. -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main>
    <h1>Comercial GYNAlimentos</h1>
    <p class="subtitulo">Cálculo de contracheque de funcionário</p>

    <!-- Formulário de coleta dos dados do funcionário -->
    <form id="idFormularioFuncionario">
      <fieldset>
        <legend>Dados do funcionário</legend>

        <!-- O "for" de cada label é IGUAL ao id do seu campo: é isso que
             liga os dois (clicar no texto foca o campo). -->
        <p>
          <label for="idInMatricula">Matrícula:</label>
          <input type="text" id="idInMatricula" placeholder="Ex: 10025" required>
        </p>

        <p>
          <label for="idInNome">Nome:</label>
          <input type="text" id="idInNome" placeholder="Ex: Maria da Silva" required>
        </p>

        <p>
          <label for="idInDependentes">Número de dependentes:</label>
          <input type="number" id="idInDependentes" min="0" step="1" placeholder="Ex: 2" required>
        </p>

        <p>
          <label for="idInSalarioBase">Salário base (R$):</label>
          <input type="number" id="idInSalarioBase" min="0.01" step="0.01" placeholder="Ex: 3000.00" required>
        </p>

        <p>
          <label for="idInProducao">Produção (itens):</label>
          <input type="number" id="idInProducao" min="0" step="1" placeholder="Ex: 1500" required>
        </p>

        <p>
          <button type="submit">Gerar Contracheque</button>
          <button type="reset">Limpar</button>
        </p>
      </fieldset>
    </form>

    <!-- Área de exibição do resultado.
         aria-live="polite": leitores de tela anunciam quando o conteúdo muda.
         <pre>: preserva espaços e quebras de linha (formato de contracheque). -->
    <section id="idOutAreaResultado" aria-live="polite">
      <pre id="idOutContracheque"></pre>
    </section>
  </main>

  <!-- type="module": o app.js usa import. O navegador segue o import e
       carrega o Funcionario.js sozinho, então só um script aqui. -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
